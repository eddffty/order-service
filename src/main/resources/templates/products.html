<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Товары</title>
</head>
<body>
<nav>
    <a th:href="@{/products/page}">Товары</a> |
    <a th:href="@{/customers/page}">Покупатели</a> |
    <a th:href="@{/orders/page}">Заказы</a> |
    <a th:href="@{/order-items/page}">Позиции заказов</a>
</nav>
<hr>
<a href="/products/new">Добавить товар</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Цена</th>
        <th>Остаток</th>
        <th></th>
    </tr>
    <tr th:each="product : ${productPage.content}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.stockQty}"></td>
        <td>
            <a th:href="@{/products/{id}/edit(id=${product.id})}">Изменить</a>
            <div sec:authorize="hasRole('ADMIN')">
                <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post">
                    <button type="submit">Удалить</button>
                </form>
            </div>
        </td>
    </tr>
</table>
<div>
    <a th:if="${productPage.hasPrevious()}" th:href="@{/products/page(page=${productPage.number - 1})}">« Назад</a>
    <span th:text="'Страница ' + (${productPage.number} + 1) + ' из ' + ${productPage.totalPages}"></span>
    <a th:if="${productPage.hasNext()}" th:href="@{/products/page(page=${productPage.number + 1})}">Вперёд »</a>
</div>
</body>
</html>
