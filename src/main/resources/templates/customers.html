<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Покупатели</title>
</head>
<body>
<nav>
    <a th:href="@{/products/page}">Товары</a> |
    <a th:href="@{/customers/page}">Покупатели</a> |
    <a th:href="@{/orders/page}">Заказы</a> |
    <a th:href="@{/order-items/page}">Позиции заказов</a>
</nav>
<hr>
<a href="/customers/new">Добавить покупателя</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Телефон</th>
        <th>Email</th>
        <th></th>
    </tr>
    <tr th:each="customer : ${customerPage.content}">
        <td th:text="${customer.id}"></td>
        <td th:text="${customer.name}"></td>
        <td th:text="${customer.phone}"></td>
        <td th:text="${customer.email}"></td>
        <td>
            <a th:href="@{/customers/{id}/edit(id=${customer.id})}">Изменить</a>
            <div sec:authorize="hasRole('ADMIN')">
                <form th:action="@{/customers/{id}/delete(id=${customer.id})}" method="post">
                    <button type="submit">Удалить</button>
                </form>
            </div>
        </td>
    </tr>
</table>
<div>
    <a th:if="${customerPage.hasPrevious()}" th:href="@{/customers/page(page=${customerPage.number - 1})}">« Назад</a>
    <span th:text="'Страница ' + (${customerPage.number} + 1) + ' из ' + ${customerPage.totalPages}"></span>
    <a th:if="${customerPage.hasNext()}" th:href="@{/customers/page(page=${customerPage.number + 1})}">Вперёд »</a>
</div>
</body>
</html>
