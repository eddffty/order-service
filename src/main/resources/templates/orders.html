<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
  <meta charset="UTF-8">
  <title>Заказы</title>
</head>
<body>
<nav>
  <a th:href="@{/products/page}">Товары</a> |
  <a th:href="@{/customers/page}">Покупатели</a> |
  <a th:href="@{/orders/page}">Заказы</a> |
  <a th:href="@{/order-items/page}">Позиции заказов</a>
</nav>
<hr>
<a href="/orders/new">Добавить заказ</a>
<table border="1">
  <tr>
    <th>ID</th>
    <th>Покупатель</th>
    <th>Статус</th>
    <th>Создан</th>
    <th>Сумма</th>
    <th></th>
  </tr>
  <tr th:each="order : ${orderPage.content}">
    <td th:text="${order.id}"></td>
    <td th:text="${order.customer.name}"></td>
    <td th:text="${order.status}"></td>
    <td th:text="${order.createdAt}"></td>
    <td th:text="${totals[order.id]}"></td>
    <td>
      <a th:href="@{/orders/{id}/edit(id=${order.id})}">Изменить</a>
      <div sec:authorize="hasRole('ADMIN')">
        <form th:action="@{/orders/{id}/delete(id=${order.id})}" method="post">
          <button type="submit">Удалить</button>
        </form>
      </div>
    </td>
  </tr>
</table>
<div>
  <a th:if="${orderPage.hasPrevious()}" th:href="@{/orders/page(page=${orderPage.number - 1})}">« Назад</a>
  <span th:text="'Страница ' + (${orderPage.number} + 1) + ' из ' + ${orderPage.totalPages}"></span>
  <a th:if="${orderPage.hasNext()}" th:href="@{/orders/page(page=${orderPage.number + 1})}">Вперёд »</a>
</div>
</body>
</html>
